<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Code Understanding Study</title>
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: one centred column. Moments of change (consent, start, the hand-over, the finish) open with a coloured panel and Bao;
   working screens (tasks, questions) stay quiet. Jade = calm, indigo = spark, apricot = "almost there". */
@font-face{font-family:"Bricolage";src:url("fonts/bricolage.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Nunito";src:url("fonts/nunito.woff2") format("woff2");font-weight:200 1000;font-display:swap}
@font-face{font-family:"JB Mono";src:url("fonts/jbmono-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"JB Mono";src:url("fonts/jbmono-500.woff2") format("woff2");font-weight:500 700;font-display:swap}
:root{
  --bg:#F1F5F1; --surface:#FFFFFF; --raised:#F6F8F5; --ink:#1B1F2A; --muted:#5D6573; --line:#DCE3DC; --line-strong:#C3CDC4;
  --brand:#4B4BE8; --brand-dark:#3333B5; --brand-soft:#E7E7FC; --brand-ink:#FFFFFF;
  --spark:#4B4BE8; --spark-dark:#3030B0;
  --jade:#D9ECE0; --jade-deep:#2E7A58; --jade-soft:#EAF4EE;
  --sun:#FFC24B; --sun-dark:#A86F00; --sun-soft:#FFF2D4;
  --go:#2E9E69; --go-dark:#1F7A50; --go-soft:#E2F4EA;
  --coral:#FF7E6B; --coral-dark:#C84B3A; --coral-soft:#FFE8E4;
  --code-bg:#F3F5F2;
  /* the illustration keeps its own ink and paper in both themes */
  --ink-art:#1B1F2A; --paper-art:#FFFDF8; --pad-art:#6B5F5A; --shadow-art:rgba(27,31,42,.14); --leaf:#7CC49A; --leaf-dark:#3F9A6B;
  /* names used by the experimenter screens */
  --accent:var(--brand); --accent-ink:var(--brand-ink); --accent-soft:var(--brand-soft);
  --ctrl:#B5650A; --ctrl-soft:#FFF0D9; --ok:var(--go-dark); --ok-soft:var(--go-soft); --bad:var(--coral-dark); --bad-soft:var(--coral-soft); --warn:#9A6200; --warn-soft:var(--sun-soft);
  --display:"Bricolage","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --sans:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JB Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#192028; --raised:#1F2731; --ink:#ECF1EC; --muted:#9CA6B0; --line:#2A333D; --line-strong:#3A4552;
  --brand:#8E8BFF; --brand-dark:#5F5CE6; --brand-soft:#252A55; --brand-ink:#11131F; --spark:#4541D2; --spark-dark:#2B289E;
  --jade:#1C3A2D; --jade-deep:#7CD2A6; --jade-soft:#17291F;
  --sun:#FFC95E; --sun-dark:#FFD27A; --sun-soft:#3A311D;
  --go:#4CC98C; --go-dark:#7CDCAA; --go-soft:#173A2A;
  --coral:#FF8F7E; --coral-dark:#FFA597; --coral-soft:#3E2427;
  --code-bg:#151B22; --shadow-art:rgba(0,0,0,.35);
  --ctrl:#FFB65C; --ctrl-soft:#3A2B17; --warn:#FFC95E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192028; --raised:#1F2731; --ink:#ECF1EC; --muted:#9CA6B0; --line:#2A333D; --line-strong:#3A4552;
  --brand:#8E8BFF; --brand-dark:#5F5CE6; --brand-soft:#252A55; --brand-ink:#11131F; --spark:#4541D2; --spark-dark:#2B289E;
  --jade:#1C3A2D; --jade-deep:#7CD2A6; --jade-soft:#17291F;
  --sun:#FFC95E; --sun-dark:#FFD27A; --sun-soft:#3A311D;
  --go:#4CC98C; --go-dark:#7CDCAA; --go-soft:#173A2A;
  --coral:#FF8F7E; --coral-dark:#FFA597; --coral-soft:#3E2427;
  --code-bg:#151B22; --shadow-art:rgba(0,0,0,.35);
  --ctrl:#FFB65C; --ctrl-soft:#3A2B17; --warn:#FFC95E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;margin:0;font-weight:500;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
.wrap.wide{max-width:980px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.015em}
h1{font-size:clamp(1.6rem,4.6vw,2.1rem)}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.label{font-size:.88rem;color:var(--muted);font-weight:700}
code,pre,textarea.code,.tile .txt,.cline .src,.cline input,#q3a,#q3b,.timer{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:58px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand svg.pa-head{width:36px;height:28px;flex:none}
@media (max-width:560px){.bar.p .brand-name{display:none}.bar.p .bar-in{flex-wrap:nowrap}}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:800;font-size:.95rem}
.nav a.admin-link{font-size:.85rem;font-weight:700;opacity:.8}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:1rem;color:var(--muted);border-color:var(--line);box-shadow:none;padding:4px 12px}
.timer:active:not(:disabled){transform:none;box-shadow:none}
.timer.hidden-clock{padding:6px 9px}
.timer.hidden-clock .t-num:empty{display:none}
.timer.low{color:var(--warn);border-color:var(--sun);background:var(--sun-soft)}
/* which group you're in: on the welcome screen and on every task */
.grp{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;padding:18px 20px;border-radius:22px;border:2px solid var(--line);background:var(--surface)}
.grp p{margin:0}
.grp.ai{border-color:var(--brand);background:var(--brand-soft)}
.grp.ctrl{border-color:var(--ctrl);background:var(--ctrl-soft)}
.grp .gi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff}
.grp.ctrl .gi{color:var(--surface)}
.grp .gi svg{width:28px;height:28px}
.grp.ai .gi{background:var(--spark)} .grp.ctrl .gi{background:var(--ctrl)}
.grp .gl{font-family:var(--display);font-size:1.4rem;line-height:1.2}
.gsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.gack{padding:14px 16px;border:2px solid var(--line-strong);border-radius:16px;background:var(--surface)}
.gstrip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px;border-radius:16px;border:2px solid var(--line)}
.gstrip.ai{border-color:var(--brand);background:var(--brand-soft)}
.gstrip.ctrl{border-color:var(--ctrl);background:var(--ctrl-soft)}
.gtag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.95rem}
.gtag svg{width:20px;height:20px}
.gtag svg{flex:none}
.gstrip.ai .gtag svg{color:var(--spark)} .gstrip.ctrl .gtag svg{color:var(--ctrl)}
.copybig{display:inline-flex;align-items:center;gap:8px;padding:10px 18px}
.copybig svg{width:20px;height:20px}
.copybig.ok{background:var(--go);border-color:var(--go);box-shadow:0 4px 0 var(--ok)}
.copybox{width:100%;font-family:var(--mono);font-size:13px;line-height:1.5}
.clock-note{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px 14px;border-radius:14px;background:var(--jade-soft);color:var(--ink);font-size:.95rem}
.clock-note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--jade-deep)}
.settle{position:fixed;inset:0;z-index:30;display:grid;place-items:center;align-content:center;gap:8px;padding:24px;text-align:center;background:var(--jade);color:var(--ink)}
.settle .pa{width:150px;height:auto}
.settle b{font-family:var(--display);font-size:1.8rem;font-weight:800}
.settle span{font-weight:700;color:var(--muted)}
.timer svg{width:16px;height:16px}

/* the participant's own journey: balls joined by a track; the first is already done */
.journey{max-width:720px;margin:0 auto;padding:2px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.j-track{position:relative;display:flex;justify-content:space-between;align-items:center;height:26px}
.j-line,.j-fill{position:absolute;left:11px;right:11px;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--line)}
.j-fill{right:auto;background:var(--jade-deep);transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.j-ball{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line-strong);display:grid;place-items:center}
.j-ball.done{background:var(--jade-deep);border-color:var(--jade-deep)}
.j-ball.done svg{width:12px;height:12px}
.j-ball.now{border-color:var(--brand);border-width:3px;box-shadow:0 0 0 5px var(--brand-soft)}
.j-ball.now::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.j-ball.end.now::after{background:var(--sun)}
.j-names{display:flex;justify-content:space-between;padding:0 11px;margin-top:6px;font-size:.78rem;color:var(--muted);font-weight:700}
.j-names>span{width:0;display:flex;justify-content:center;white-space:nowrap}
.j-names>span:first-child{justify-content:flex-start;margin-left:-11px}
.j-names>span:last-child{justify-content:flex-end;margin-right:-11px}
.j-names>span.now{color:var(--ink);font-weight:800}
.j-cap{display:none;justify-content:space-between;gap:10px;margin-top:6px;font-size:.85rem;font-weight:700;color:var(--muted)}
.j-cap b{color:var(--ink)}
@media (max-width:600px){.j-names{display:none}.j-cap{display:flex}}

/* cards */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px}
.hint{background:var(--raised);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;font-size:.95rem}
.hint.warn{background:var(--sun-soft);border-color:var(--sun)}
.hint.ok{background:var(--go-soft);border-color:var(--go)}

/* coloured hero panel with Bao */
.panel{position:relative;isolation:isolate;border-radius:28px;padding:26px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:end;overflow:hidden}
.panel .p-text{display:flex;flex-direction:column;gap:10px;align-self:center;padding-bottom:4px}
.panel h1{font-size:clamp(1.75rem,6vw,2.5rem)}
.panel p{font-size:1.04rem;max-width:34ch}
.panel .pa{width:clamp(140px,30vw,190px);height:auto;margin:-8px -6px -20px 0}
.panel.jade{background:var(--jade);color:var(--ink)}
.panel.spark{background:var(--spark);color:#fff}
.panel.spark p{color:rgba(255,255,255,.88)}
.panel.sun{background:var(--sun-soft);color:var(--ink)}
.panel.sun h1{color:var(--ink)}
.panel.tall{min-height:280px}
.panel>*{position:relative;z-index:1}
.panel::before{content:"";position:absolute;z-index:0;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18);pointer-events:none}
.panel.jade::before{background:rgba(255,255,255,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel.jade::before,:root:not([data-theme="light"]) .panel.sun::before{background:rgba(255,255,255,.05)}}
:root[data-theme="dark"] .panel.jade::before,:root[data-theme="dark"] .panel.sun::before{background:rgba(255,255,255,.05)}
@media (max-width:540px){
  .panel{grid-template-columns:1fr;justify-items:center;text-align:center;padding:18px 18px 24px;gap:2px}
  .panel .pa{order:-1;width:158px;margin:0 0 -2px}
  .panel .p-text{align-items:center}
  .panel p{max-width:32ch}
  .panel.tall{min-height:0}
}
.center{text-align:center;align-items:center}

/* inputs */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800}
input[type=text],input[type=number],input[type=password],textarea{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:14px;padding:12px 14px;width:100%}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
textarea{min-height:120px;resize:vertical}
textarea.code{font-family:var(--mono);font-size:14.5px;font-weight:500;line-height:1.65;min-height:200px;tab-size:4;white-space:pre;overflow-x:auto;background:var(--code-bg)}
button:focus-visible,summary:focus-visible,a:focus-visible,.tile:focus-visible,.cline:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--ink);flex:none}

/* buttons: ink pills for everyday steps, indigo for the start and finish */
button{font:inherit;font-weight:800;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:11px 22px;cursor:pointer;box-shadow:0 3px 0 var(--line-strong);transition:transform .06s,box-shadow .06s}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line-strong)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 55%,var(--bg))}
button.primary:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,var(--bg))}
button.go{background:var(--spark);border-color:var(--spark);color:#fff;box-shadow:0 4px 0 var(--spark-dark)}
button.go:active:not(:disabled){box-shadow:0 1px 0 var(--spark-dark)}
.panel.spark button.go{background:#fff;color:var(--spark-dark);border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
button.big{padding:15px 30px;font-size:1.06rem;min-width:180px}
button.link{border:0;background:none;padding:4px 0;color:var(--brand);box-shadow:none}
button.quiet{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted);padding-inline:6px}
button.danger{color:var(--coral-dark);border-color:var(--coral);background:var(--surface);box-shadow:0 3px 0 var(--coral-soft)}
button.small{padding:6px 14px;font-size:.88rem;box-shadow:0 2px 0 var(--line-strong)}
button:disabled{opacity:.42;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

/* choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:18px}
.choice b{font-size:1.02rem;font-weight:800}
.choice span{font-size:.88rem;color:var(--muted);font-weight:600}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--raised);box-shadow:0 3px 0 var(--ink)}
.scale{display:flex;gap:10px;flex-wrap:wrap}
.scale .choice{align-items:center;min-width:58px;padding:11px 16px;border-radius:999px}

pre.code{font-family:var(--mono);font-size:14px;line-height:1.65;background:var(--code-bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:0;overflow-x:auto;white-space:pre}
details.ref{border:1.5px solid var(--line);border-radius:18px;background:var(--surface)}
details.ref summary{cursor:pointer;padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:8px}
details.ref summary svg{width:20px;height:20px;flex:none}
details.ref>div{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.tip{border-color:var(--sun);background:var(--sun-soft)}

/* facts on the information sheet */
.facts{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start}
.facts .fi{width:38px;height:38px;border-radius:12px;background:var(--jade-soft);color:var(--jade-deep);display:grid;place-items:center}
.facts .fi svg{width:20px;height:20px}
.facts b{display:block}

/* the welcome's three tasks */
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center}
.steps .n{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-family:var(--display);font-weight:800;display:grid;place-items:center}

/* chip */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:800;padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.calm{color:var(--jade-deep);border-color:var(--jade-deep);background:var(--jade-soft)}
.chip.ai{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
.chip.ctrl{color:var(--ctrl);border-color:var(--ctrl);background:var(--ctrl-soft)}
.chip.ok{color:var(--ok);border-color:var(--go);background:var(--go-soft)}
.chip.warn{color:var(--warn);border-color:var(--sun);background:var(--sun-soft)}
.chip.bad{color:var(--coral-dark);border-color:var(--coral);background:var(--coral-soft)}

/* Task 1: tile puzzle */
.board{display:flex;flex-direction:column;gap:8px;min-height:250px;padding:12px;border-radius:20px;background:var(--code-bg);border:2px dashed var(--line-strong)}
.slot{height:46px;border-radius:14px;border:2px dashed var(--line-strong);opacity:.55}
.bank{display:flex;flex-direction:column;gap:8px}
.tile{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surface);box-shadow:0 3px 0 var(--line-strong);cursor:pointer;text-align:left;font:inherit;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tile .num{flex:none;width:26px;height:26px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-weight:900;font-size:.85rem;display:grid;place-items:center}
.tile .txt{font-family:var(--mono);font-size:14px;white-space:pre;overflow-x:auto;font-weight:500}
.tile.ghost{background:transparent;box-shadow:none;border-style:dashed;cursor:default}
.tile.ghost>*{visibility:hidden}
.tile.placed{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.tile.sortable-ghost{opacity:.35}
.tile.sortable-chosen{box-shadow:0 10px 22px rgba(0,0,0,.18)}
.handle{flex:none;margin-left:auto;color:var(--muted);cursor:grab;display:grid;place-items:center;padding:2px 4px}
.handle svg{width:18px;height:18px}

/* Task 2: tap-a-line editor */
.lines{border:1.5px solid var(--line-strong);border-radius:16px;background:var(--code-bg);overflow:hidden}
.cline{display:flex;align-items:stretch;gap:0;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:0;border-radius:0;box-shadow:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.cline:last-child{border-bottom:0}
.cline:active:not(:disabled){transform:none;box-shadow:none}

  return "\n\n__inp = " + pyLit(input) + "\n__exp = " + pyLit(expected) + "\n__err = None\ntry:\n" + fnLine +

    res.method="exact"; res.p_greater=ge/total; res.p_less=le/total; res.p_two=Math.min(1,2*Math.min(res.p_greater,res.p_less));
  } else {
    const mu=n1*n2/2, sigma=Math.sqrt(n1*n2/12*((N+1)-tieSum/(N*(N-1))));
    if (sigma===0){ res.method="normal"; res.p_greater=1; res.p_less=1; res.p_two=1; return res; }
    res.method="normal approximation (ties)";
    res.p_greater = 1-Phi((U1-mu-0.5)/sigma);
    res.p_less = Phi((U1-mu+0.5)/sigma);
    res.p_two = Math.min(1, 2*(1-Phi((Math.abs(U1-mu)-0.5)/sigma)));
  }
  return res;
}

function lnFact(n){ let s=0; for(let i=2;i<=n;i++) s+=Math.log(i); return s; }
// Fisher's exact test on [[a,b],[c,d]] where rows = AI, Control; cols = full, not full.
function fisher(a,b,c,d){
  const r1=a+b, r2=c+d, c1=a+c, N=a+b+c+d;
  if (N===0) return null;
  const lo=Math.max(0,c1-r2), hi=Math.min(r1,c1);
  const lp = x => lnFact(r1)+lnFact(r2)+lnFact(c1)+lnFact(N-c1)-lnFact(N)-lnFact(x)-lnFact(r1-x)-lnFact(c1-x)-lnFact(r2-c1+x);
  const pObs=Math.exp(lp(a)); let less=0, greater=0, two=0;
  for (let x=lo;x<=hi;x++){ const p=Math.exp(lp(x)); if(x<=a) less+=p; if(x>=a) greater+=p; if(p<=pObs*(1+1e-7)) two+=p; }
  return { p_less:Math.min(1,less), p_greater:Math.min(1,greater), p_two:Math.min(1,two) };
}
// Agreement between two markers' scores on the same answers: share identical, and Cohen's kappa (unweighted)
function agreement(pairs){
  const n=pairs.length; if(!n) return null;
  const cats=[...new Set(pairs.flat())], agree=pairs.filter(([a,b])=>a===b).length, po=agree/n;
  let pe=0; for(const c of cats) pe+=(pairs.filter(p=>p[0]===c).length/n)*(pairs.filter(p=>p[1]===c).length/n);
  return { n, agree, po, pe, kappa: pe>=1-1e-12 ? null : (po-pe)/(1-pe) };
}

let skulptPromise=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load failed: "+src)); document.head.appendChild(s); }); }
function loadSkulpt(){
  if (!skulptPromise){
    skulptPromise = loadScript("vendor/skulpt.min.js")
      .then(()=>loadScript("vendor/skulpt-stdlib.js"))
      .catch(e=>{ skulptPromise=null; throw e; });
  }
  return skulptPromise;
}
let runQueue = Promise.resolve();
function runPython(src){
  const job = runQueue.then(()=> new Promise(resolve=>{
    let out="";
    Sk.configure({ output:t=>{ out+=t; }, read:f=>{ if(!Sk.builtinFiles || Sk.builtinFiles.files[f]===undefined) throw "File not found: '"+f+"'"; return Sk.builtinFiles.files[f]; },
      __future__:Sk.python3, execLimit:2000, inputfun:()=>"" });
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,src,true))
      .then(()=>resolve({ok:true,out}), e=>resolve({ok:false,out,err:String(e)}));
  }));
  runQueue = job.catch(()=>{});
  return job;
}
const gradeCache = new Map();
async function gradeCode(kind, code){
  if (code==null || !String(code).trim()){ const z=TESTS[kind].cases.map(()=>0); z.blank=true; return z; }
  const key = kind+"\u0000"+code;
  if (gradeCache.has(key)) return gradeCache.get(key);
  await loadSkulpt();
  const out=[], info=[];
  let stuck=false;
  for (const [inp,exp] of TESTS[kind].cases){
    if (stuck){ out.push(0); info.push({ problem:stuck }); continue; }
    const r = await runPython(String(code)+harness(kind,inp,exp));
    if (!r.ok && /TimeLimitError/.test(r.err||"")) stuck=codeProblem(r.err); // code that never stops fails the remaining tests too
    out.push(r.ok && r.out.includes("@@RESULT@@1") ? 1 : 0);
    // what the function gave back: the last @@GOT@@ line (anything the participant's own code printed comes before it)
    const got = r.ok ? (r.out.split("@@GOT@@").pop().split("\n")[0]) : null;
    info.push(r.ok ? (got.startsWith("!") ? { error:got.slice(1) } : { got }) : { problem:codeProblem(r.err) });
  }
  out.info = info; // extra detail for the results page; the array itself is unchanged
  gradeCache.set(key,out);
  return out;
}
async function gradeSession(s){
  const order = parseOrder(s.tasks?.t1_order);
  const asGiven = n => Object.assign(new Array(n).fill(0), { asGiven:true });
  const t1 = order ? await gradeCode("t1", buildT1(order)) : Object.assign([0,0,0], { blank:true });
  // Kit rule: a task left as given (not attempted) scores 0 on its tests.
  const t2 = (s.tasks?.t2_code||"")===T2_TEMPLATE ? asGiven(3) : await gradeCode("t2", s.tasks?.t2_code);
  const t3 = (s.tasks?.t3_code||"").trim()===T3_TEMPLATE.trim() ? asGiven(4) : await gradeCode("t3", s.tasks?.t3_code);
  const mod = await gradeCode("mod", s.understanding?.mod_code);
  return { t1, t2, t3, mod };
}

    [["en","EN"],["zh","中文"]].map(([v,lab])=>el("button",{type:"button","aria-pressed":String(LANG()===v),onclick:()=>{

}

function confetti(){

  const c=el("canvas",{id:"confetti"}); document.body.appendChild(c);
  const ctx=c.getContext("2d"), W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=["#FFC24B","#FFFFFF","#7CC49A","#FF7E6B","#B9B7FF"];
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.3,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(tm){ const k=(tm-t0)/1000; ctx.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=0.45; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.a+=p.s; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-k/2.8); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
    if(k<2.8) requestAnimationFrame(f); else c.remove(); })(t0);
}

function taskTimer(){
  const LIMIT=600, label=el("span",{class:"t-num"});

/* guided marking: a two-point checklist per question; the score is the number of ticks (same 0/1/2 scale as the kit) */
const GUIDE={
  q1:{ title:"Q1 · What was wrong with count_even?", ask:()=>I18N.en.q1p, show:s=>s.tasks?.t2_code, label:"Their fixed version",
    crit:[["Names the mistake","Says it counted odd numbers (remainder 1) instead of even ones, or that == 1 should be == 0"],
          ["Explains why the fix works","Says even numbers have remainder 0 when divided by 2, so n % 2 == 0 picks them"]] },
  q2:{ title:"Q2 · Walk through \"Dog cat dog\"", ask:()=>I18N.en.q2p(), show:s=>s.tasks?.t3_code, label:"Their Task 3 code",
    crit:[["Counts are right","dog = 2 and cat = 1 (upper and lower case counted together)"],
          ["Return is right","Gives back \"dog\" and points to the line that picks it"]] }
};
let inFlow=false, flowKeys=null;
function setKeys(fn){ if(flowKeys) document.removeEventListener("keydown",flowKeys); flowKeys=fn||null; if(fn) document.addEventListener("keydown",fn); }
function startMarking(rater){
  inFlow=true; closeDetail();
  const queue=[];
  for(const s of allSessions()) if(counted(s)) for(const q of ["q1","q2"]) if(!autoZero(s,q)&&(s.marks||{})[q+rater]==null) queue.push([s.id,q]);
  // shuffle so marking order doesn't follow session order
  for(let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  markStep(rater,queue,0);
}
/* the checklist both marking and settling use; calls onSave(score) */
function checklist(G,onSave,saveLabel,onSkip){
  const ticks=new Set(), score=el("b",{},"0");
  const crit=G.crit.map(([title,sub],j)=>el("button",{type:"button",class:"crit","aria-pressed":"false",onclick:()=>toggle(j)},
    el("span",{class:"box","aria-hidden":"true"},"✓"),el("span",{},el("b",{},title),el("span",{},sub)),el("kbd",{},j+1)));
  function toggle(j){ ticks.has(j)?ticks.delete(j):ticks.add(j); crit[j].setAttribute("aria-pressed",String(ticks.has(j))); score.textContent=ticks.size; }
  const save=()=>{ setKeys(null); onSave(ticks.size); };
  setKeys(e=>{
    if(document.querySelector("#modal-root .modal")||(e.target.closest&&e.target.closest("input,textarea,select"))) return;
    if(e.key==="1"||e.key==="2"){ e.preventDefault(); toggle(+e.key-1); }
    else if(e.key==="0"){ e.preventDefault(); setKeys(null); onSave(0); }
    else if(e.key==="Enter"&&!(e.target.closest&&e.target.closest("button:not(.crit)"))){ e.preventDefault(); save(); }
    else if(onSkip&&(e.key==="s"||e.key==="S")){ e.preventDefault(); setKeys(null); onSkip(); }
  });
  return el("div",{class:"stack"},
    el("span",{class:"f"},"Tick what the answer does"),
    el("div",{class:"stack",style:"gap:10px"},crit,
      el("button",{type:"button",class:"crit none",onclick:()=>{ setKeys(null); onSave(0); }},
        el("span",{class:"box","aria-hidden":"true"},"0"),el("span",{},el("b",{},"Scores 0"),el("span",{},"Neither point: wrong, off-topic, or \"I don't know\". Saves and moves on.")),el("kbd",{},"0"))),
    el("div",{class:"mk-total"},el("span",{class:"label"},"Score"),score,el("span",{class:"muted"},"/ 2"),el("span",{style:"flex:1"}),
      onSkip? el("button",{onclick:()=>{ setKeys(null); onSkip(); }},"Skip for now") : null,
      el("button",{class:"primary",onclick:save},saveLabel)),
    el("p",{class:"small muted keys"},"Keys: ",el("kbd",{},"1")," ",el("kbd",{},"2")," tick, ",el("kbd",{},"0")," scores 0, ",el("kbd",{},"Enter")," save",onSkip?[", ",el("kbd",{},"S")," skip"]:null,"."));
}
function answerBlock(s,q){
  const G=GUIDE[q];
  return el("div",{class:"card stack"},
    el("div",{class:"label"},"They were asked"),el("p",{class:"small",style:"font-style:italic"},G.ask()),
    el("div",{class:"label"},G.label),codeView(G.show(s)||""),
    el("div",{class:"label"},"Their answer"),
    el("p",{class:"answer big"},(s.understanding||{})[q]||"(no answer)"));
}
function markStep(rater,queue,i,opt={}){
  const app=document.getElementById("app"); app.className="wrap"; app.innerHTML="";

    if(opt.back) return back();
    app.append(el("div",{class:"stack-lg fade"},el("h1",{},"Marking finished"),el("p",{class:"muted"},"You've marked every answer you hadn't marked yet as "+MK(rater).toLowerCase()+"."),el("div",{},el("button",{class:"primary",onclick:back},"Back to results"))));
    return;

  app.append(el("div",{class:"stack-lg fade"},
    el("div",{class:"stack",style:"gap:8px"},
      el("div",{class:"spread"},el("div",{class:"label"},MK(rater)+" · answer "+(i+1)+" of "+queue.length+" · group hidden"),el("button",{class:"link",onclick:back},"Stop and go back")),
      el("div",{class:"meter"},el("i",{style:"width:"+Math.round(100*i/queue.length)+"%"}))),
    el("h1",{},GUIDE[q].title),

      if(a!=null&&a===b) s.marks[q]=a; else if(a!=null&&b!=null) s.marks[q]=null;
      saveSoon(s); markStep(rater,queue,i+1,opt); },"Save and next",()=>markStep(rater,queue,i+1,opt))));
  window.scrollTo(0,0);
}
function disagreeList(){ const out=[]; for(const s of allSessions()){ if(!counted(s)) continue; const m=s.marks||{}; for(const q of ["q1","q2"]) if(m[q+"A"]!=null&&m[q+"B"]!=null&&m[q+"A"]!==m[q+"B"]&&m[q]==null) out.push([s.id,q]); } return out; }
function startSettling(){ inFlow=true; closeDetail(); settleStep(disagreeList(),0); }
function settleStep(list,i,opt={}){

/* downloads */
function csvText(){
  const head=["code","group","group_set_by","level","practice","excluded","date","time_sec","finished","t1_score","t2_score","t3_score","tests_passed","q1_marker1","q1_marker2","q1","q2_marker1","q2_marker2","q2","q3","change_score","change_full","understanding_score","questions_time_sec","python_months","python_self_rating","ai_tool_use","used_counter_before","ai_app","prompts","ai_use_coder1","ai_use_coder2","ai_use","notes"];
  const rows=allSessions().map(s=>{ const x=d(s), m=s.marks||{}, q=s.questionnaire||{};
    return [s.code,s.group,s.assigned||"",s.level,s.pilot?1:0,s.excluded?1:0,new Date(s.created_at).toISOString(),s.time_sec,s.finished?1:0,x.t1,x.t2,x.t3,x.tests,m.q1A,m.q1B,m.q1,m.q2A,m.q2B,m.q2,x.q3,x.mod,x.modFull,x.under,s.u_time_sec,q.python_months,q.python_self_rating,q.ai_tool_use,q.used_counter_before,s.model,s.ai?.prompts,s.ai?.catA,s.ai?.catB,s.ai?.category,s.notes]; });

}
function offer(filename,text){
  const blob=new Blob([text],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
async function downloadCSV(){ if(needGrading()) await gradeAll(); offer("study-results.csv",csvText()); }
function downloadJSON(){ offer("study-backup.json",JSON.stringify({format:"psp404-kit2",exported_at:new Date().toISOString(),sessions:allSessions()})); }
/* answers a participant copied on the finish screen when their connection failed (text starting PSP404:) */
function pasteImport(){
  const box=el("textarea",{id:"paste-answers",placeholder:"PSP404:…",style:"min-height:80px;font-family:var(--mono);font-size:12px"});
  const msg=el("p",{class:"small",role:"status"});
  const btn=el("button",{class:"primary",onclick:()=>{
    const found=(box.value.match(/PSP404:[A-Za-z0-9_-]+/g)||[]); let n=0, bad=0;
    for(const tok of found){ try{ const s=unb64(tok.slice(7)); if(!s||!s.id||!s.code||!s.tasks){ bad++; continue; }
        const cur=allSessions().find(x=>x.id===s.id); if(cur){ continue; } saveLocal(s); queue({action:"submit",session:s}); n++; }catch(e){ bad++; } }
    msg.textContent = !found.length? "No answers found. Paste the whole message, starting with PSP404:" : n+" session"+(n===1?"":"s")+" added"+(bad?", "+bad+" couldn't be read":"")+".";
    if(n){ box.value=""; setTimeout(redraw,900); } }},"Add pasted answers");
  return el("div",{class:"stack"},el("b",{},"Answers sent by message"),
    el("p",{class:"small muted"},"If a participant's connection failed, their finish screen lets them copy their answers. Paste the text they sent you here."),
    box,el("div",{},btn),msg);
}
function importFile(f){
  if(!f) return; const r=new FileReader();
  r.onload=async()=>{ let n=0; try{ const data=JSON.parse(r.result), list=Array.isArray(data)?data:data.sessions;
      for(const s of list||[]){ if(!s||!s.id||!s.code) continue; const cur=allSessions().find(x=>x.id===s.id); if(cur&&(cur.updated_at||0)>=(s.updated_at||0)) continue; saveLocal(s); queue({action:"submit",session:s}); n++; }
      confirmBox("Import finished",n+" session"+(n===1?"":"s")+" added.","OK",redraw); }
    catch(e){ confirmBox("That file didn't work","Choose a study-backup.json file downloaded from this page.","OK",redraw); } };
  r.readAsText(f);
}

/* ---------- analysis ---------- */
function vAnalysis(){
  const app=document.getElementById("app"); app.className="wrap wide"; app.innerHTML="";
  const skipChose=!!lsGet("psp404-skip-chose",false), base=allSessions().filter(s=>!s.pilot&&!s.excluded);
  const nChose=base.filter(s=>s.assigned==="chose").length, nUnknown=base.filter(s=>!s.assigned).length;
  const use=base.filter(s=>!(skipChose&&s.assigned==="chose")), A=use.filter(s=>s.group==="AI"), C=use.filter(s=>s.group==="Control");
  const choseCard=(nChose||nUnknown)? el("div",{class:"card stack"},
    el("h2",{},"Groups the participants chose"),
    el("p",{class:"small muted"},nChose+" counted session"+(nChose===1?"":"s")+" had their group chosen by the participant"+(nUnknown?", and "+nUnknown+" don't say how it was set (set it in Results → session → Group set by)":"")+". Self-chosen groups can differ before the study starts, so check that the results still hold without them, and report it."),
    el("label",{class:"check"},el("input",{type:"checkbox",checked:skipChose,onchange:e=>{ lsSet("psp404-skip-chose",e.target.checked); vAnalysis(); }}),
      el("span",{},el("b",{},"Leave out sessions where the participant chose the group")))) : null;
  const H=[
    {title:"H1 · Is the AI group faster?",get:s=>s.time_sec,alt:"less",max:600,unit:"seconds",say:(a,c)=>"AI group median "+fmtN(a,0)+" s, Control "+fmtN(c,0)+" s."},
    {title:"H2 · Does the AI group pass more tests?",get:s=>d(s).tests,alt:"greater",max:10,unit:"tests out of 10",say:(a,c)=>"AI group median "+fmtN(a)+", Control "+fmtN(c)+" (out of 10)."},
    {title:"H3 · Does the AI group understand their code less?",get:s=>d(s).under,alt:"less",max:10,unit:"points out of 10",say:(a,c)=>"AI group median "+fmtN(a)+", Control "+fmtN(c)+" (out of 10)."}
  ];
  app.append(el("div",{class:"stack-lg fade"},
    keyCard(),
    el("div",{class:"stack"},el("h1",{},"Analysis"),el("p",{class:"muted"},A.length+" AI and "+C.length+" Control participants. Practice runs and excluded sessions aren't counted"+(skipChose&&nChose?", nor the "+nChose+" self-chosen":"")+".")),
    choseCard,
    !use.length? el("div",{class:"card"},el("p",{class:"muted"},"Results appear here once both groups have finished sessions.")) : null,
    ...(use.length?H.map(h=>hCard(h,A,C)):[]),
    use.length? moreCard(A,C) : null,
    el("div",{class:"hint small stack"},
      el("p",{},el("b",{},"How to read this. "),"“Supported” means the difference is unlikely to be chance (one-sided p below .05, Mann–Whitney U). “Not shown” means there isn't enough evidence for the prediction; with small groups that is not the same as “no effect”."))));
  if(grading!=="running"&&needGrading()) gradeAll();
}
function hCard(h,A,C){
  const a=A.map(h.get).filter(v=>v!=null&&!isNaN(v)), c=C.map(h.get).filter(v=>v!=null&&!isNaN(v));
  const mw=a.length&&c.length?mannWhitney(a,c):null, p=mw?(h.alt==="less"?mw.p_less:mw.p_greater):null;
  const missing=A.length+C.length-a.length-c.length;
  const verdict=!mw?el("span",{class:"chip"},"Waiting for both groups"):p<0.05?el("span",{class:"chip ok"},"Supported"):el("span",{class:"chip warn"},"Not shown");
  return el("section",{class:"card stack"},
    el("div",{class:"spread"},el("h2",{},h.title),verdict),
    el("p",{class:"verdict"},mw?h.say(median(a),median(c))+" p = "+fmtP(p)+".":"Needs at least one finished session in each group."),
    dots(a,c,h.max),
    missing? el("p",{class:"small muted"},missing+" session"+(missing===1?" isn't":"s aren't")+" included yet"+(h.max===10&&h.title.startsWith("H3")?" because Q1 or Q2 still needs a final mark.":" while code is being checked.")) : null,
    mw? el("details",{class:"ref"},el("summary",{},"Details for the report"),el("div",{},el("table",{},el("tbody",{},

        ["Mann–Whitney U (AI)",fmtN(mw.U1)],["p one-sided",fmtP(p)],["p two-sided",fmtP(mw.p_two)],["Rank-biserial r",fmtN(mw.r_rb,2)],["Method",mw.method]]

    const md=median(vals); if(md!=null) add("line",{x1:x(md),x2:x(md),y1:y-15,y2:y+15,stroke:"var(--ink)","stroke-width":2.5});

}

/* ---------- routing ---------- */
const ROUTES={setup:vSetup,results:vResults,analysis:vAnalysis,admin:vAdmin};
function currentRoute(){ const h=location.hash.slice(1); if(!ROUTES[h]) return "setup"; if((h==="results"||h==="analysis")&&!isAdmin()) return "admin"; return h; }
function route(){ inFlow=false; setKeys(null); if(currentRoute()!=="results") closeDetail(); participantMode=false; setProgress(null); const r=currentRoute(); if(location.hash.slice(1)!==r && r==="admin") history.replaceState(null,"","#admin"); paintBar(); ROUTES[r](); }
function redraw(){ document.getElementById("modal-root").innerHTML=""; route(); }
let pending=false;
function typing(){ const a=document.activeElement; return a&&a.closest&&a.closest("#app,#drawer-root")&&/^(INPUT|TEXTAREA)$/.test(a.tagName); }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(pending&&!typing()){ pending=false; dataChanged(); } },0));
function dataChanged(){
  if(participantMode) return;
  const app=document.getElementById("app");
  if(app.querySelector(".modal")) return;
  const r=currentRoute();
  if(r==="setup"||r==="admin"){ return; }
  if(typing()){ pending=true; return; }
  if(inFlow) return; // never jump out of a marking screen
  const y=window.scrollY; ROUTES[r](); window.scrollTo(0,y);
}
window.addEventListener("hashchange",()=>{ if(!participantMode) route(); });
if(!joinFromLink()){
  if(draft&&draft.remote) show();
  else if(draft&&draft.step&&!["consent","welcome","done"].includes(draft.step)) show();
  else { if(draft&&draft.step==="done") clearDraft(); route(); }
}
