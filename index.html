<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Code Understanding Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one centred column per screen, chunky tactile controls, a thick rounded progress bar; the mascot appears at the start, between parts and at the end. */
:root{
  --bg:#f6f6fb; --surface:#ffffff; --raised:#f1f1f8; --ink:#1f2140; --muted:#676b8c; --line:#e2e2ee; --line-strong:#cdcee2;
  --brand:#7c5cff; --brand-dark:#5a3fd8; --brand-soft:#efeaff; --brand-ink:#ffffff;
  --sun:#ffc83d; --sun-dark:#d99a00; --sun-soft:#fff5d9;
  --go:#22b864; --go-dark:#178a4a; --go-soft:#e1f6ea;
  --coral:#ff6b6b; --coral-dark:#d64545; --coral-soft:#ffe9e9;
  --code-bg:#f3f2fb;
  /* names used by the experimenter screens */
  --accent:var(--brand); --accent-ink:var(--brand-ink); --accent-soft:var(--brand-soft);
  --ctrl:#c46f00; --ctrl-soft:#fff1d6; --ok:var(--go-dark); --ok-soft:var(--go-soft); --bad:var(--coral-dark); --bad-soft:var(--coral-soft); --warn:#b36b00; --warn-soft:var(--sun-soft);
  --sans:'Nunito',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13142a; --surface:#1c1e39; --raised:#24264a; --ink:#eef0ff; --muted:#a3a7cc; --line:#32355d; --line-strong:#454879;
  --brand:#9d88ff; --brand-dark:#6b54e0; --brand-soft:#2a2759; --brand-ink:#14152b;
  --sun:#ffd25e; --sun-dark:#b98a10; --sun-soft:#3a3220;
  --go:#46d488; --go-dark:#2a9c5d; --go-soft:#1b3a2b;
  --coral:#ff8a8a; --coral-dark:#ff9b9b; --coral-soft:#3e2229;
  --code-bg:#171933; --ctrl:#ffb44d; --ctrl-soft:#3a2c17; --warn:#ffc35c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13142a; --surface:#1c1e39; --raised:#24264a; --ink:#eef0ff; --muted:#a3a7cc; --line:#32355d; --line-strong:#454879;
  --brand:#9d88ff; --brand-dark:#6b54e0; --brand-soft:#2a2759; --brand-ink:#14152b;
  --sun:#ffd25e; --sun-dark:#b98a10; --sun-soft:#3a3220;
  --go:#46d488; --go-dark:#2a9c5d; --go-soft:#1b3a2b;
  --coral:#ff8a8a; --coral-dark:#ff9b9b; --coral-soft:#3e2229;
  --code-bg:#171933; --ctrl:#ffb44d; --ctrl-soft:#3a2c17; --warn:#ffc35c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;margin:0;font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px}
.wrap.wide{max-width:980px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;font-weight:800}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.25rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:58px}
.brand{font-weight:900;display:flex;align-items:center;gap:8px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:12px;font-weight:800;font-size:.95rem;border:2px solid transparent}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.progress{height:14px;border-radius:999px;background:var(--line);max-width:688px;width:calc(100% - 32px);margin:0 auto 12px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:999px;background:var(--go);position:relative;transition:width .45s cubic-bezier(.3,1.4,.5,1);min-width:14px}
.progress i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:999px;background:rgba(255,255,255,.35)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;color:var(--brand);border-color:var(--brand)}
.timer.low{color:var(--coral-dark);border-color:var(--coral);background:var(--coral-soft)}
.timer svg{width:16px;height:16px}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px}
.hint{background:var(--raised);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:.95rem}
.hint.warn{background:var(--sun-soft);border-color:var(--sun)}
.hint.ok{background:var(--go-soft);border-color:var(--go)}

/* inputs */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800}
input[type=text],input[type=number],textarea{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
textarea{min-height:120px;resize:vertical}
textarea.code{font-family:var(--mono);font-size:14.5px;font-weight:500;line-height:1.65;min-height:200px;tab-size:4;white-space:pre;overflow-x:auto;background:var(--code-bg)}
button:focus-visible,summary:focus-visible,a:focus-visible,.tile:focus-visible,.cline:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--brand);flex:none}

/* chunky buttons */
button{font:inherit;font-weight:800;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 var(--line-strong);transition:transform .06s,box-shadow .06s;letter-spacing:.02em}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line-strong)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 var(--brand-dark);text-transform:uppercase;letter-spacing:.06em}
button.primary:active:not(:disabled){box-shadow:0 1px 0 var(--brand-dark)}
button.go{background:var(--go);border-color:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-dark);text-transform:uppercase;letter-spacing:.06em}
button.go:active:not(:disabled){box-shadow:0 1px 0 var(--go-dark)}
button.big{padding:15px 30px;font-size:1.05rem;min-width:180px}
button.link{border:0;background:none;padding:4px 0;color:var(--brand);box-shadow:none}
button.danger{color:var(--coral-dark);border-color:var(--coral);background:var(--surface);box-shadow:0 4px 0 var(--coral-soft)}
button.small{padding:6px 12px;font-size:.88rem;border-radius:12px;box-shadow:0 3px 0 var(--line-strong)}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

/* choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;text-transform:none;letter-spacing:0}
.choice b{font-size:1.02rem;font-weight:800}
.choice span{font-size:.88rem;color:var(--muted);font-weight:600}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 4px 0 var(--brand)}
.choice[aria-pressed="true"] b{color:var(--brand)}
.scale{display:flex;gap:10px;flex-wrap:wrap}
.scale .choice{align-items:center;min-width:58px;padding:12px 16px}

pre.code{font-family:var(--mono);font-size:14px;line-height:1.65;background:var(--code-bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0;overflow-x:auto;white-space:pre}
details.ref{border:2px solid var(--line);border-radius:16px;background:var(--surface)}
details.ref summary{cursor:pointer;padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:8px}
details.ref summary svg{width:20px;height:20px;flex:none}
details.ref>div{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.tip{border-color:var(--sun);background:var(--sun-soft)}

/* Task 1: tile puzzle */
.board{display:flex;flex-direction:column;gap:8px;min-height:250px;padding:12px;border-radius:18px;background:var(--code-bg);border:2px dashed var(--line-strong)}
.slot{height:46px;border-radius:14px;border:2px dashed var(--line-strong);opacity:.6}
.bank{display:flex;flex-direction:column;gap:8px}
.tile{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line-strong);cursor:pointer;text-align:left;font:inherit;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tile .num{flex:none;width:26px;height:26px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-weight:900;font-size:.85rem;display:grid;place-items:center}
.tile .txt{font-family:var(--mono);font-size:14px;white-space:pre;overflow-x:auto;font-weight:500}
.tile.ghost{visibility:visible;background:var(--raised);box-shadow:none;border-style:dashed;cursor:default}
.tile.ghost>*{visibility:hidden}
.tile.placed{border-color:var(--brand);box-shadow:0 4px 0 var(--brand-dark)}
.tile.sortable-ghost{opacity:.35}
.tile.sortable-chosen{box-shadow:0 8px 18px rgba(0,0,0,.18)}
.handle{flex:none;margin-left:auto;color:var(--muted);cursor:grab;display:grid;place-items:center;padding:2px 4px}
.handle svg{width:18px;height:18px}

/* Task 2: tap-a-line editor */
.lines{border:2px solid var(--line);border-radius:16px;background:var(--code-bg);overflow:hidden}
.cline{display:flex;align-items:stretch;gap:0;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:0;border-radius:0;box-shadow:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer;text-transform:none;letter-spacing:0}
.cline:last-child{border-bottom:0}
.cline:active:not(:disabled){transform:none;box-shadow:none}
.cline .ln{flex:none;width:42px;padding:9px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;background:color-mix(in srgb,var(--line) 45%,transparent)}
.cline .src{flex:1;padding:9px 12px;font-family:var(--mono);font-size:14.5px;white-space:pre;overflow-x:auto;font-weight:500;min-width:0}
.cline:hover .src{background:var(--brand-soft)}
.cline.edited .ln{background:var(--sun);color:#3b2a00;font-weight:800}
.cline.editing{background:var(--surface)}
.cline input{font-family:var(--mono);font-size:14.5px;border:0;border-radius:0;padding:9px 12px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--brand)}

.editorbar{display:flex;gap:8px;flex-wrap:wrap}

/* mascot + speech bubble */
.hero{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.mascot{width:120px;height:120px;flex:none}
.bubble{position:relative;flex:1;min-width:220px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;font-weight:700;font-size:1.1rem}
.bubble::before{content:"";position:absolute;left:-11px;bottom:26px;width:18px;height:18px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@media (max-width:520px){.bubble::before{display:none}.mascot{width:96px;height:96px}}
.center{text-align:center;align-items:center}
.bigicon{width:140px;height:140px}

/* chips + experimenter tables */
.chip{display:inline-flex;align-items:center;font-size:.8rem;font-weight:800;padding:2px 10px;border-radius:999px;border:2px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ai{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
.chip.ctrl{color:var(--ctrl);border-color:var(--ctrl);background:var(--ctrl-soft)}
.chip.ok{color:var(--ok);border-color:var(--go);background:var(--go-soft)}
.chip.warn{color:var(--warn);border-color:var(--sun);background:var(--sun-soft)}
.chip.bad{color:var(--coral-dark);border-color:var(--coral);background:var(--coral-soft)}
.list{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.item+.item{border-top:2px solid var(--line)}
.item>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:70px 90px 1fr auto;gap:10px;align-items:center}
.item>summary::-webkit-details-marker{display:none}
.item>summary .chip{justify-self:start}
.item>summary .nums{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted)}
.item[open]>summary{background:var(--raised)}
.item .body{padding:16px;display:flex;flex-direction:column;gap:14px;border-top:2px solid var(--line)}
@media (max-width:560px){.item>summary{grid-template-columns:60px 1fr auto}.item>summary .nums{display:none}}
.ticks{display:inline-flex;gap:4px;flex-wrap:wrap}
.tick{font-family:var(--mono);font-size:.75rem;padding:1px 6px;border-radius:6px;font-weight:700}
.tick.p{background:var(--go-soft);color:var(--ok)}
.tick.f{background:var(--coral-soft);color:var(--coral-dark)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stats>div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.stats b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.3rem}
.verdict{font-size:1.05rem;font-weight:800}
svg text{fill:var(--muted);font-family:var(--sans);font-size:12px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* overlays */
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#0b0c1a 55%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:420px;width:100%}
.countdown{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg)}
.countdown b{font-size:min(38vw,220px);font-weight:900;color:var(--brand);line-height:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.calm h1{font-weight:700}
.calm button.primary{text-transform:none;letter-spacing:.01em}
.calm .card{border-color:var(--line)}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .25s ease-out}
  @keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pop{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
  .bob{animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .countdown b{animation:zoom .9s ease-out both}
  @keyframes zoom{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:1}}
}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<script src="config.js"></script>
</head>

<header class="bar"><div class="bar-in" id="bar"></div><div class="progress" id="progress" hidden><i></i></div></header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>

<script>
/*PURE-START*/
const T1_LINES = {
  1: "    return total / len(numbers)",
  2: "    total = 0",
  3: "        total += n",
  4: "def average(numbers):",
  5: "    for n in numbers:"
};
const T2_TEMPLATE = "def count_even(numbers):\n    count = 0\n    for n in numbers:\n        if n % 2 == 1:\n            count += 1\n    return count\n";
const T3_TEMPLATE = "from collections import Counter\n\ndef top_word(text):\n    # TODO: finish this function\n";
const TESTS = {
  t1: { fn: "average", cases: [[[2,4,6],4.0],[[5],5.0],[[1,2,3,4],2.5]] },
  t2: { fn: "count_even", cases: [[[2,4,6,7],3],[[],0],[[1,3,5],0]] },
  t3: { fn: "top_word", cases: [["the cat and the hat","the"],["Apple apple banana","apple"],["one","one"],["b a B c b a","b"]] },
  mod: { fn: "__MOD__", cases: [["a b a c b a",["a","b"]],["x y x",["x","y"]],["Red red blue green green green",["green","red"]],["cat dog cat",["cat","dog"]]] }
};

function parseOrder(s){
  const d = String(s||"").match(/[1-5]/g) || [];
  if (d.length !== 5) return null;
  if (new Set(d).size !== 5) return null;
  return d.map(Number);
}
function buildT1(order){ return order.map(i => T1_LINES[i]).join("\n") + "\n"; }

// JSON literals are valid Python literals for the numbers, plain strings and lists used in the tests.
function pyLit(v){ return JSON.stringify(v); }
function harness(kind, input, expected){
  const fnLine = kind === "mod"
    ? "    try:\n        __f = top_two\n    except NameError:\n        __f = top_word\n"
    : "    __f = " + TESTS[kind].fn + "\n";
  const cmp = kind === "mod"
    ? "    __ok = isinstance(__r, (list, tuple)) and list(__r) == __exp\n"
    : "    __ok = (__r == __exp)\n";
  return "\n\n__inp = " + pyLit(input) + "\n__exp = " + pyLit(expected) + "\ntry:\n" + fnLine +
    "    __r = __f(__inp)\n" + cmp + "except Exception:\n    __ok = False\nprint('@@RESULT@@' + ('1' if __ok else '0'))\n";
}

function normQ3a(s){ return String(s||"").replace(/[,()\[\]'"]/g," ").trim().split(/\s+/).filter(Boolean).join(" "); }
function normQ3b(s){ return String(s||"").replace(/['"\s]/g,""); }
function scoreQ3(a,b){ return (normQ3a(a)==="3 0"?1:0) + (normQ3b(b)==="a"?1:0); }

function median(xs){ if(!xs.length) return null; const s=[...xs].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2? s[m] : (s[m-1]+s[m])/2; }
function mean(xs){ return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
function sd(xs){ if(xs.length<2) return null; const m=mean(xs); return Math.sqrt(xs.reduce((a,b)=>a+(b-m)*(b-m),0)/(xs.length-1)); }

function erf(x){ // Abramowitz & Stegun 7.1.26
  const s = x<0?-1:1; x=Math.abs(x);
  const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
function Phi(z){ return 0.5*(1+erf(z/Math.SQRT2)); }

// Mann–Whitney U for sample a vs b. U1 counts pairs where a > b (ties 0.5).
function mannWhitney(a, b){
  const n1=a.length, n2=b.length, N=n1+n2;
  if (n1<1||n2<1) return null;
  const all = a.map(v=>({v,g:0})).concat(b.map(v=>({v,g:1}))).sort((x,y)=>x.v-y.v);
  const ranks = new Array(N); let tieSum=0, hasTies=false;
  for (let i=0;i<N;){ let j=i; while(j+1<N && all[j+1].v===all[i].v) j++; const r=(i+j)/2+1; for(let k=i;k<=j;k++) ranks[k]=r; const t=j-i+1; if(t>1){tieSum+=t*t*t-t;hasTies=true;} i=j+1; }
  let R1=0; for(let k=0;k<N;k++) if(all[k].g===0) R1+=ranks[k];
  const U1 = R1 - n1*(n1+1)/2;
  const res = { U1, U2: n1*n2-U1, n1, n2, r_rb: 2*U1/(n1*n2)-1 };
  if (!hasTies && N <= 80){
    // exact null distribution of U1 via counting subsets of ranks 1..N of size n1 by rank sum
    const maxS = N*(N+1)/2;
    let f = Array.from({length:n1+1},()=>new Float64Array(maxS+1)); f[0][0]=1;
    for (let r=1;r<=N;r++){ for (let k=Math.min(r,n1);k>=1;k--){ const fk=f[k], fk1=f[k-1]; for (let s=maxS;s>=r;s--){ if(fk1[s-r]) fk[s]+=fk1[s-r]; } } }
    const dist = f[n1]; let total=0; for (let s=0;s<=maxS;s++) total+=dist[s];
    const off = n1*(n1+1)/2; let ge=0, le=0;
    for (let s=0;s<=maxS;s++){ if(!dist[s]) continue; const u=s-off; if(u>=U1-1e-9) ge+=dist[s]; if(u<=U1+1e-9) le+=dist[s]; }
    res.method="exact"; res.p_greater=ge/total; res.p_less=le/total; res.p_two=Math.min(1,2*Math.min(res.p_greater,res.p_less));
  } else {
    const mu=n1*n2/2, sigma=Math.sqrt(n1*n2/12*((N+1)-tieSum/(N*(N-1))));
    if (sigma===0){ res.method="normal"; res.p_greater=1; res.p_less=1; res.p_two=1; return res; }
    res.method="normal approximation (ties)";
    res.p_greater = 1-Phi((U1-mu-0.5)/sigma);
    res.p_less = Phi((U1-mu+0.5)/sigma);
    res.p_two = Math.min(1, 2*(1-Phi((Math.abs(U1-mu)-0.5)/sigma)));
  }
  return res;
}

function lnFact(n){ let s=0; for(let i=2;i<=n;i++) s+=Math.log(i); return s; }
// Fisher's exact test on [[a,b],[c,d]] where rows = AI, Control; cols = full, not full.
function fisher(a,b,c,d){
  const r1=a+b, r2=c+d, c1=a+c, N=a+b+c+d;
  if (N===0) return null;
  const lo=Math.max(0,c1-r2), hi=Math.min(r1,c1);
  const lp = x => lnFact(r1)+lnFact(r2)+lnFact(c1)+lnFact(N-c1)-lnFact(N)-lnFact(x)-lnFact(r1-x)-lnFact(c1-x)-lnFact(r2-c1+x);
  const pObs=Math.exp(lp(a)); let less=0, greater=0, two=0;
  for (let x=lo;x<=hi;x++){ const p=Math.exp(lp(x)); if(x<=a) less+=p; if(x>=a) greater+=p; if(p<=pObs*(1+1e-7)) two+=p; }
  return { p_less:Math.min(1,less), p_greater:Math.min(1,greater), p_two:Math.min(1,two) };
}

let skulptPromise=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load failed: "+src)); document.head.appendChild(s); }); }
function loadSkulpt(){
  if (!skulptPromise){
    skulptPromise = loadScript("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js")
      .then(()=>loadScript("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"))
      .catch(e=>{ skulptPromise=null; throw e; });
  }
  return skulptPromise;
}
let runQueue = Promise.resolve();
function runPython(src){
  const job = runQueue.then(()=> new Promise(resolve=>{
    let out="";
    Sk.configure({ output:t=>{ out+=t; }, read:f=>{ if(!Sk.builtinFiles || Sk.builtinFiles.files[f]===undefined) throw "File not found: '"+f+"'"; return Sk.builtinFiles.files[f]; },
      __future__:Sk.python3, execLimit:2000, inputfun:()=>"" });
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,src,true))
      .then(()=>resolve({ok:true,out}), e=>resolve({ok:false,out,err:String(e)}));
  }));
  runQueue = job.catch(()=>{});
  return job;
}
const gradeCache = new Map();
async function gradeCode(kind, code){
  if (code==null || !String(code).trim()) return TESTS[kind].cases.map(()=>0);
  const key = kind+"\u0000"+code;
  if (gradeCache.has(key)) return gradeCache.get(key);
  await loadSkulpt();
  const out=[];
  let stuck=false;
  for (const [inp,exp] of TESTS[kind].cases){
    if (stuck){ out.push(0); continue; }
    const r = await runPython(String(code)+harness(kind,inp,exp));
    if (!r.ok && /TimeLimitError/.test(r.err||"")) stuck=true; // code that never stops fails the remaining tests too
    out.push(r.ok && r.out.includes("@@RESULT@@1") ? 1 : 0);
  }
  gradeCache.set(key,out);
  return out;
}
async function gradeSession(s){
  const order = parseOrder(s.tasks?.t1_order);
  const t1 = order ? await gradeCode("t1", buildT1(order)) : [0,0,0];
  // Kit rule: a task left as given (not attempted) scores 0 on its tests.
  const t2 = (s.tasks?.t2_code||"")===T2_TEMPLATE ? [0,0,0] : await gradeCode("t2", s.tasks?.t2_code);
  const t3 = (s.tasks?.t3_code||"").trim()===T3_TEMPLATE.trim() ? [0,0,0,0] : await gradeCode("t3", s.tasks?.t3_code);
  const mod = await gradeCode("mod", s.understanding?.mod_code);
  return { t1, t2, t3, mod };
}

function confetti(){
  if(reduceMotion()) return;
  const c=el("canvas",{id:"confetti"}); document.body.appendChild(c);
  const ctx=c.getContext("2d"), W=c.width=innerWidth, H=c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement), cols=["--brand","--sun","--go","--coral"].map(v=>cs.getPropertyValue(v).trim()||"#7c5cff");
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/1000; ctx.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=0.45; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.a+=p.s; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-k/2.6); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
    if(k<2.6) requestAnimationFrame(f); else c.remove(); })(t0);
}

function clockText(left){ const s=Math.max(0,Math.ceil(left)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function taskTimer(){
  const LIMIT=600, label=el("span",{}), t=el("span",{class:"pill timer",role:"timer","aria-label":"Time left"},svgNode(ICON.clock),label);
  const up=()=>{
    const left=LIMIT-(Date.now()-draft.started_at)/1000;

    if(left<=60 && left>0 && !draft.warned){ draft.warned=true; saveDraft(); toast("1 minute left"); }
    if(left<=0) submitTasks(true);

function sTask1(){
  const T=draft.tasks;
  let seq=Array.isArray(T.t1_seq)?T.t1_seq.slice():(parseOrder(T.t1_order)||[]);
  const board=el("div",{class:"board","aria-label":"Your function, top to bottom"}), bank=el("div",{class:"bank","aria-label":"Lines to use"});
  const persist=()=>{ T.t1_seq=seq.slice(); T.t1_order=seq.join(" "); saveDraft(); };
  const tile=(id,placed)=>{
    const b=el("button",{type:"button",class:"tile"+(placed?" placed":""),"data-id":id,"aria-label":(placed?"Remove line ":"Add line ")+id},
      el("span",{class:"num"},id), el("span",{class:"txt"},T1_LINES[id]), placed?el("span",{class:"handle","aria-hidden":"true"},svgNode(ICON.grip)):null);
    b.addEventListener("click",()=>{ if(placed) seq=seq.filter(x=>x!==id); else if(!seq.includes(id)) seq.push(id); persist(); render(id); });

    for(let id=1;id<=5;id++) bank.appendChild(seq.includes(id)? el("div",{class:"tile ghost"},el("span",{class:"num"},id)) : tile(id,false));

    Sortable.create(board,{animation:180,draggable:".tile",delayOnTouchOnly:true,delay:120,
      onEnd:()=>{ seq=[...board.querySelectorAll(".tile")].map(t=>+t.dataset.id); persist(); render(); }});
  }).catch(()=>{});
  taskFrame(1,"Put the lines in order",["These lines make a function that returns the ",el("b",{},"average")," of a list of numbers. Tap them in the right order. The indentation is already right."],
    el("div",{class:"stack"},

      board,

      el("div",{class:"label"},"Lines"), bank));

    el("div",{class:"stack"},G.levels.map(([v,t,sub])=>el("button",{class:"choice",style:"flex-direction:row;gap:14px;align-items:center",onclick:()=>{ s.marks[q]=+v; saveSoon(s); settleStep(list,i+1); }},el("b",{style:"font-size:1.3rem;min-width:22px"},t),el("span",{},sub))))));
}

/* downloads */
function csvText(){
  const head=["code","group","level","practice","excluded","date","time_sec","finished","t1_score","t2_score","t3_score","tests_passed","q1_marker1","q1_marker2","q1","q2_marker1","q2_marker2","q2","q3","change_score","change_full","understanding_score","questions_time_sec","python_months","python_self_rating","ai_tool_use","used_counter_before","ai_app","prompts","ai_use_coder1","ai_use_coder2","ai_use","notes"];
  const rows=allSessions().map(s=>{ const x=d(s), m=s.marks||{}, q=s.questionnaire||{};
    return [s.code,s.group,s.level,s.pilot?1:0,s.excluded?1:0,new Date(s.created_at).toISOString(),s.time_sec,s.finished?1:0,x.t1,x.t2,x.t3,x.tests,m.q1A,m.q1B,m.q1,m.q2A,m.q2B,m.q2,x.q3,x.mod,x.modFull,x.under,s.u_time_sec,q.python_months,q.python_self_rating,q.ai_tool_use,q.used_counter_before,s.model,s.ai?.prompts,s.ai?.catA,s.ai?.catB,s.ai?.category,s.notes]; });
  const esc=v=>{ if(v==null) return ""; const t=String(v); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  return [head,...rows].map(r=>r.map(esc).join(",")).join("\n");
}
function offer(filename,text){
  const blob=new Blob([text],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
async function downloadCSV(){ if(needGrading()) await gradeAll(); offer("study-results.csv",csvText()); }
function downloadJSON(){ offer("study-backup.json",JSON.stringify({format:"psp404-kit2",exported_at:new Date().toISOString(),sessions:allSessions()})); }
function importFile(f){
  if(!f) return; const r=new FileReader();
  r.onload=async()=>{ let n=0; try{ const data=JSON.parse(r.result), list=Array.isArray(data)?data:data.sessions;
      for(const s of list||[]){ if(!s||!s.id||!s.code) continue; const cur=allSessions().find(x=>x.id===s.id); if(cur&&(cur.updated_at||0)>=(s.updated_at||0)) continue; saveLocal(s); queue({action:"submit",session:s}); n++; }
      confirmBox("Import finished",n+" session"+(n===1?"":"s")+" added.","OK",redraw); }
    catch(e){ confirmBox("That file didn't work","Choose a study-backup.json file downloaded from this page.","OK",redraw); } };
  r.readAsText(f);
}

/* ---------- analysis ---------- */
function vAnalysis(){
  const app=document.getElementById("app"); app.className="wrap wide"; app.innerHTML="";
  const use=allSessions().filter(s=>!s.pilot&&!s.excluded), A=use.filter(s=>s.group==="AI"), C=use.filter(s=>s.group==="Control");
  const H=[
    {title:"H1 · Is the AI group faster?",get:s=>s.time_sec,alt:"less",max:600,unit:"seconds",say:(a,c)=>"AI group median "+fmtN(a,0)+" s, Control "+fmtN(c,0)+" s."},
    {title:"H2 · Does the AI group pass more tests?",get:s=>d(s).tests,alt:"greater",max:10,unit:"tests out of 10",say:(a,c)=>"AI group median "+fmtN(a)+", Control "+fmtN(c)+" (out of 10)."},
    {title:"H3 · Does the AI group understand their code less?",get:s=>d(s).under,alt:"less",max:10,unit:"points out of 10",say:(a,c)=>"AI group median "+fmtN(a)+", Control "+fmtN(c)+" (out of 10)."}
  ];
  app.append(el("div",{class:"stack-lg fade"},
    keyCard(),
    el("div",{class:"stack"},el("h1",{},"Analysis"),el("p",{class:"muted"},A.length+" AI and "+C.length+" Control participants. Practice runs and excluded sessions aren't counted.")),
    !use.length? el("div",{class:"card"},el("p",{class:"muted"},"Results appear here once both groups have finished sessions.")) : null,
    ...(use.length?H.map(h=>hCard(h,A,C)):[]),
    use.length? moreCard(A,C) : null,
    el("div",{class:"hint small stack"},
      el("p",{},el("b",{},"How to read this. "),"“Supported” means the difference is unlikely to be chance (one-sided p below .05, Mann–Whitney U). “Not shown” means there isn't enough evidence for the prediction; with small groups that is not the same as “no effect”."))));
  if(grading!=="running"&&needGrading()) gradeAll();
}
function hCard(h,A,C){
  const a=A.map(h.get).filter(v=>v!=null&&!isNaN(v)), c=C.map(h.get).filter(v=>v!=null&&!isNaN(v));
  const mw=a.length&&c.length?mannWhitney(a,c):null, p=mw?(h.alt==="less"?mw.p_less:mw.p_greater):null;
  const missing=A.length+C.length-a.length-c.length;
  const verdict=!mw?el("span",{class:"chip"},"Waiting for both groups"):p<0.05?el("span",{class:"chip ok"},"Supported"):el("span",{class:"chip warn"},"Not shown");
  return el("section",{class:"card stack"},
    el("div",{class:"spread"},el("h2",{},h.title),verdict),
    el("p",{class:"verdict"},mw?h.say(median(a),median(c))+" p = "+fmtP(p)+".":"Needs at least one finished session in each group."),
    dots(a,c,h.max),
    missing? el("p",{class:"small muted"},missing+" session"+(missing===1?" isn't":"s aren't")+" included yet"+(h.max===10&&h.title.startsWith("H3")?" because Q1 or Q2 still needs a final mark.":" while code is being checked.")) : null,
    mw? el("details",{class:"ref"},el("summary",{},"Details for the report"),el("div",{},el("table",{},el("tbody",{},
      ...[["n (AI / Control)",a.length+" / "+c.length],["Mean (SD), AI",fmtN(mean(a))+" ("+fmtN(sd(a))+")"],["Mean (SD), Control",fmtN(mean(c))+" ("+fmtN(sd(c))+")"],
        ["Mann–Whitney U (AI)",fmtN(mw.U1)],["p one-sided",fmtP(p)],["p two-sided",fmtP(mw.p_two)],["Rank-biserial r",fmtN(mw.r_rb,2)],["Method",mw.method]]
      .map(([k,v])=>el("tr",{},el("td",{},k),el("td",{class:"n"},v))))))) : null);
}
function dots(a,c,max){
  const W=640,H=110,L=78,R=18,T=10,B=24,x=v=>L+(W-L-R)*(Math.min(v,max)/max), ns="http://www.w3.org/2000/svg", svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("width","100%"); svg.setAttribute("role","img"); svg.setAttribute("aria-label","Each participant's score, by group; the dark line is the median");
  const add=(t,at,tx)=>{ const n=document.createElementNS(ns,t); for(const k in at) n.setAttribute(k,at[k]); if(tx!=null) n.textContent=tx; svg.appendChild(n); };
  for(const t of (max===600?[0,120,240,360,480,600]:[0,2,4,6,8,10])){ add("line",{x1:x(t),x2:x(t),y1:T,y2:H-B,stroke:"var(--line)"}); add("text",{x:x(t),y:H-6,"text-anchor":"middle"},t); }
  for(const [lab,vals,y,col] of [["AI",a,T+20,"var(--accent)"],["Control",c,T+56,"var(--ctrl)"]]){
    add("text",{x:6,y:y+4},lab); const seen=new Map();
    for(const v of vals){ const k=Math.round(v*10), i=seen.get(k)||0; seen.set(k,i+1); add("circle",{cx:x(v),cy:y+(i%2?1:-1)*Math.ceil(i/2)*7,r:5.5,fill:col,"fill-opacity":.75,stroke:col}); }
    const md=median(vals); if(md!=null) add("line",{x1:x(md),x2:x(md),y1:y-15,y2:y+15,stroke:"var(--ink)","stroke-width":2.5});
  }
  return el("div",{style:"overflow-x:auto"},svg);
}
function moreCard(A,C){
  const num=(arr,k)=>arr.map(s=>+s.questionnaire?.[k]).filter(v=>!isNaN(v)), cnt=(arr,f)=>arr.filter(f).length;
  const full=arr=>arr.map(s=>d(s).modFull).filter(v=>v!=null), fa=full(A), fc=full(C);
  const fz=fa.length&&fc.length? fisher(fa.filter(v=>v).length,fa.filter(v=>!v).length,fc.filter(v=>v).length,fc.filter(v=>!v).length):null;
  const und=arr=>arr.map(s=>d(s).under).filter(v=>v!=null);
  const tr=(k,va,vc)=>el("tr",{},el("td",{},k),el("td",{class:"n"},va),el("td",{class:"n"},vc));
  return el("details",{class:"ref"},el("summary",{},"More: group balance, the code change, how AI was used"),
    el("div",{},el("table",{},el("thead",{},el("tr",{},el("th",{},""),el("th",{style:"text-align:right"},"AI"),el("th",{style:"text-align:right"},"Control"))),el("tbody",{},
      tr("One course / two or more",cnt(A,s=>s.level==="1")+" / "+cnt(A,s=>s.level==="2+"),cnt(C,s=>s.level==="1")+" / "+cnt(C,s=>s.level==="2+")),
      tr("Median months of Python",fmtN(median(num(A,"python_months"))),fmtN(median(num(C,"python_months")))),
      tr("Median skill (1–5)",fmtN(median(num(A,"python_self_rating"))),fmtN(median(num(C,"python_self_rating")))),
      tr("Used Counter before",cnt(A,s=>s.questionnaire?.used_counter_before==="yes"),cnt(C,s=>s.questionnaire?.used_counter_before==="yes")),
      tr("Code change fully correct",fa.filter(v=>v).length+" of "+fa.length,fc.filter(v=>v).length+" of "+fc.length),
      ...["Delegation","Engaged","Minimal"].map(k=>{ const g=A.filter(s=>s.ai?.category===k); return tr("Understanding, AI "+k.toLowerCase()+" (n "+g.length+")",fmtN(median(und(g))),""); }),
      tr("Understanding, Control (n "+C.length+")","",fmtN(median(und(C)))))),
      el("p",{class:"small muted"},"Code change, Fisher's exact test (AI fewer fully correct): p = "+(fz?fmtP(fz.p_less):"—")+" one-sided, "+(fz?fmtP(fz.p_two):"—")+" two-sided. The ChatGPT-use rows are descriptive only.")));
}

/* ---------- routing ---------- */
const ROUTES={setup:vSetup,results:vResults,analysis:vAnalysis};
function currentRoute(){ const h=location.hash.slice(1); return ROUTES[h]?h:"setup"; }
function route(){ inFlow=false; participantMode=false; setProgress(null); paintBar(); ROUTES[currentRoute()](); }
function redraw(){ document.getElementById("modal-root").innerHTML=""; route(); }
let pending=false;
function typing(){ const a=document.activeElement; return a&&a.closest&&a.closest("#app")&&/^(INPUT|TEXTAREA)$/.test(a.tagName); }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(pending&&!typing()){ pending=false; dataChanged(); } },0));
function dataChanged(){
  if(participantMode) return;
  const app=document.getElementById("app");
  if(app.querySelector(".modal")) return;
  const r=currentRoute();
  if(r==="setup"){ return; }
  if(typing()){ pending=true; return; }
  if(inFlow) return; // never jump out of a marking screen
  const y=window.scrollY; ROUTES[r](); window.scrollTo(0,y);
}
window.addEventListener("hashchange",()=>{ if(!participantMode) route(); });
if(!joinFromLink()){
  if(draft&&draft.remote) show();
  else if(draft&&draft.step&&!["consent","welcome","done"].includes(draft.step)) show();
  else { if(draft&&draft.step==="done") clearDraft(); route(); }
}
initDb();
